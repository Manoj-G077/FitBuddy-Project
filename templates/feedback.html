{% extends "base.html" %}
{% block title %}FitBuddy – Update Plan{% endblock %}
{% block content %}
<section class="card narrow">
  <p class="eyebrow">FEEDBACK LOOP</p>
  <h1>Update an existing plan</h1>
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  <form method="post" action="/submit-feedback">
    <div class="field">
      <label>User ID</label>
      <input name="user_id" required pattern="[A-Za-z0-9_-]+">
    </div>
    <div class="field">
      <label>Feedback</label>
      <textarea name="feedback" maxlength="1500" required placeholder="Tell FitBuddy what you want changed"></textarea>
    </div>
    <button type="submit">Update plan</button>
  </form>
</section>
{% endblock %}
